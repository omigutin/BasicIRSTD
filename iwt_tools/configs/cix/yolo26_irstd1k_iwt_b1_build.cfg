[Common]
mode = build

[Parser]
model_type = ONNX
model_name = yolo26_irstd1k_iwt_b1_xy_wh
detection_postprocess =
model_domain = OBJECT_DETECTION
input_data_format = NCHW
input_model = model/yolo26_irstd1k_iwt_b1_xy_wh_scores.onnx
input = images
input_shape = [1, 3, 512, 640]
output_dir = ./out

[Optimizer]
dataset = numpydataset
calibration_data = datasets/calibration_data.npy
calibration_batch_size = 40
output_dir = ./out
dump_dir = ./out
quantize_method_for_activation = per_tensor_asymmetric
quantize_method_for_weight = per_channel_symmetric_restricted_range
save_statistic_info = True
cast_dtypes_for_lib = True

[GBuilder]
target = X2_1204MP3
outputs = yolo26_irstd1k_iwt_b1_xy_wh.cix
tiling = fps
