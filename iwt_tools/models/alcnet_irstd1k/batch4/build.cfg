[Common]
mode = build

[Parser]
model_type = ONNX
model_name = alcnet_irstd1k
input_data_format = NCHW
input_model = alcnet_irstd1k.onnx
input = input
output = probability_map
input_shape = [4, 1, 640, 512]
output_dir = .

[Optimizer]
dataset = numpydataset
calibration_data = datasets/calibration.npy
calibration_batch_size = 40
output_dir = .
dump_dir = ./out
quantize_method_for_activation = per_tensor_asymmetric
quantize_method_for_weight = per_channel_symmetric_restricted_range
save_statistic_info = True
cast_dtypes_for_lib = True

[GBuilder]
target = X2_1204MP3
outputs = alcnet_irstd1k.cix
tiling = fps
